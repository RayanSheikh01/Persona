[project]
name = "persona"
version = "0.1.0"
description = "AI companion with persistent typed memory."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "python-dotenv>=1.0",
  "sse-starlette>=2.0",
  "langgraph>=0.0.40",
  "langgraph-checkpoint-sqlite>=1.0.0",
  "langchain-core>=0.1.45",
  "huggingface_hub>=0.24",
  "sentence-transformers>=2.7",
  "sqlite-vec>=0.1.1",
  "numpy>=1.26",
  "simplemem",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=4.1",
  "httpx>=0.27",
  "ruff>=0.4",
  "mypy>=1.10",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["persona*"]
